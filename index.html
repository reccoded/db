<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>STORY DB</title>
<style>
:root{--bg:#e9e8e4;--panel:#f5f4f1;--card:#fffefa;--line:#d4d2cc;--text:#262626;--muted:#77746e;--accent:#4d555b;--soft:#deddda;--danger:#8b4545;--shadow:0 8px 24px rgba(30,30,30,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR","Segoe UI",sans-serif;line-height:1.55}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}.app{max-width:1180px;margin:auto;min-height:100vh}.top{position:sticky;top:0;z-index:20;background:rgba(233,232,228,.94);backdrop-filter:blur(12px);padding:14px 16px 10px;border-bottom:1px solid var(--line)}.brandrow{display:flex;align-items:center;gap:10px}.brand{font-weight:850;letter-spacing:.08em}.spacer{flex:1}.iconbtn,.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 11px}.iconbtn{min-width:40px}.primary{background:var(--accent);color:white;border-color:var(--accent)}.danger{color:var(--danger)}.tabs{display:flex;gap:6px;margin-top:10px;overflow:auto}.tab{border:0;background:transparent;padding:7px 10px;border-radius:8px;color:var(--muted);white-space:nowrap}.tab.active{background:var(--card);color:var(--text);font-weight:700}.main{padding:16px}.toolbar{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:10px}.search{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 13px}.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.chip,.mini{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 10px;font-size:13px}.chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}.card h3{margin:0;font-size:18px}.meta{font-size:12px;color:var(--muted);margin-top:3px}.hook{font-weight:700;margin:10px 0 4px}.logline{font-size:14px;color:#454545}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}.tag{font-size:12px;background:var(--soft);padding:3px 7px;border-radius:999px}.cardfoot{display:flex;align-items:center;gap:6px;margin-top:12px}.star{border:0;background:transparent;font-size:21px;padding:0 4px}.empty{text-align:center;color:var(--muted);padding:70px 20px}.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:12px}.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field{margin-bottom:12px}.field label,.section-title{display:block;font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.04em;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 10px}.field textarea{min-height:86px;resize:vertical}.titleline{display:flex;align-items:center;gap:8px}.titleline input{font-size:22px;font-weight:800;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:4px 0}.cast-toggle{border:0;background:transparent;padding:3px;font-size:18px}.castbox{margin-top:10px}.itemrow{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;margin-bottom:6px}.itemrow.one{grid-template-columns:1fr auto}.sep{height:1px;background:var(--line);margin:14px 0}.accordion{border-top:1px solid var(--line)}.acc-head{width:100%;display:flex;justify-content:space-between;border:0;background:transparent;padding:12px 0;font-weight:800}.acc-body{padding-bottom:10px}.hidden{display:none!important}.savebar{position:sticky;bottom:10px;display:flex;justify-content:flex-end;pointer-events:none}.saved{background:#333;color:#fff;border-radius:999px;padding:6px 10px;font-size:12px;opacity:.88}.episode-tabs{display:flex;gap:6px;overflow:auto;padding-bottom:8px}.episode-tabs button{white-space:nowrap}.episode-summary{display:grid;grid-template-columns:56px 1fr;gap:7px;align-items:center;margin-bottom:7px}.scopebox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}.scopegrid{display:flex;gap:6px;flex-wrap:wrap}.match{border-left:3px solid #8b8f92;padding-left:10px;margin-top:8px;font-size:13px;color:#505050}.match mark{background:#d8d6cc}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.listedit{display:flex;gap:6px;margin-bottom:6px}.listedit input{flex:1}.notice{font-size:13px;color:var(--muted)}
@media(max-width:650px){.main{padding:12px}.top{padding:11px 12px 8px}.grid{grid-template-columns:1fr}.row,.settings-grid{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr auto}.panel{padding:13px}.itemrow{grid-template-columns:1fr 1fr auto}.titleline input{font-size:20px}.hide-mobile{display:none}}
</style>
</head>
<body><div class="app">
<header class="top"><div class="brandrow"><div class="brand">STORY DB</div><div class="spacer"></div><button class="btn primary" id="newBtn">＋ 작품</button></div><nav class="tabs"><button class="tab active" data-view="library">라이브러리</button><button class="tab" data-view="collect">모아보기</button><button class="tab" data-view="settings">설정</button></nav></header>
<main class="main" id="main"></main></div>
<script>
const DB_NAME='storyReferenceDB', DB_VERSION=1, STORE='works';
const DEFAULT_GENRES=['드라마','코미디','로맨스','스릴러','미스터리','범죄','액션','공포','SF','판타지','가족','시대극','기타'];
const TYPES=['영화','시리즈','단막','단편'];
const POINTS=[['opening','오프닝'],['inciting','발단'],['obstacle','주요 장애물'],['push','PUSH'],['midpoint','중간점'],['climax','절정'],['end','엔드']];
const SCOPES=[['all','전체'],['title','제목'],['tags','태그'],['hook','후킹'],['logline','로그라인'],['story','줄거리'],['qa','Q&A'],['point','POINT'],['check','CHECK'],['cast','등장인물']];
let db, works=[], currentView='library', editing=null, searchState={q:'',scopes:['all'],type:'전체',genre:'전체',favorite:false,sort:'updated'};
let genres=JSON.parse(localStorage.getItem('storydb_genres')||'null')||DEFAULT_GENRES.slice();
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2)}
function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=()=>{let d=r.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:'id'})};r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}
function allDB(){return new Promise((res,rej)=>{let r=db.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function putDB(w){return new Promise((res,rej)=>{let r=db.transaction(STORE,'readwrite').objectStore(STORE).put(w);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function delDB(id){return new Promise((res,rej)=>{let r=db.transaction(STORE,'readwrite').objectStore(STORE).delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function blank(){let now=new Date().toISOString();return{id:uid(),dataVersion:1,title:'',type:'영화',genre:'드라마',length:'',tags:[],hook:'',logline:'',cast:[],qa:[],acts:{gi:'',seung:'',jeon:'',gyeol:''},points:Object.fromEntries(POINTS.map(([k])=>[k,''])),characters:'',check:'',episodes:[],favorite:false,createdAt:now,updatedAt:now}}
function isSeries(w){return w.type==='시리즈'}
function ensureEpisodes(w){if(!isSeries(w))return;let n=Math.max(1,parseInt(w.length)||1);while(w.episodes.length<n)w.episodes.push({number:w.episodes.length+1,summary:'',story:'',qa:[],points:Object.fromEntries(POINTS.map(([k])=>[k,''])),check:''});if(w.episodes.length>n)w.episodes=w.episodes.slice(0,n)}
function render(){document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view===currentView)); if(editing)return renderEditor(editing); if(currentView==='library')renderLibrary(); else if(currentView==='collect')renderCollect(); else renderSettings()}
function workText(w,scope){let vals=[];if(scope==='title')vals=[w.title];if(scope==='tags')vals=w.tags;if(scope==='hook')vals=[w.hook];if(scope==='logline')vals=[w.logline];if(scope==='cast')vals=w.cast.flatMap(x=>[x.name,x.actor]);if(scope==='qa')vals=w.qa.flatMap(x=>[x.q,x.a]);if(scope==='check')vals=[w.check];if(scope==='story')vals=[...Object.values(w.acts)];if(scope==='point')vals=Object.values(w.points);if(isSeries(w)){if(scope==='story')vals.push(...w.episodes.flatMap(e=>[e.summary,e.story]));if(scope==='qa')vals.push(...w.episodes.flatMap(e=>e.qa.flatMap(x=>[x.q,x.a])));if(scope==='point')vals.push(...w.episodes.flatMap(e=>Object.values(e.points)));if(scope==='check')vals.push(...w.episodes.map(e=>e.check))}return vals.filter(Boolean).join(' ')}
function searchable(w){return SCOPES.slice(1).map(([s])=>workText(w,s)).join(' ')}
function filtered(){let q=searchState.q.trim().toLowerCase();let a=works.filter(w=>{if(searchState.type!=='전체'&&w.type!==searchState.type)return false;if(searchState.genre!=='전체'&&w.genre!==searchState.genre)return false;if(searchState.favorite&&!w.favorite)return false;if(q){let scopes=searchState.scopes.includes('all')?SCOPES.slice(1).map(x=>x[0]):searchState.scopes;if(!scopes.some(s=>workText(w,s).toLowerCase().includes(q)))return false}return true});a.sort((x,y)=>searchState.sort==='title'?x.title.localeCompare(y.title,'ko'):searchState.sort==='created'?y.createdAt.localeCompare(x.createdAt):y.updatedAt.localeCompare(x.updatedAt));return a}
function renderLibrary(){let a=filtered();$('#main').innerHTML=`<div class="toolbar"><input class="search" id="search" placeholder="검색" value="${esc(searchState.q)}"><button class="btn" id="scopeBtn">범위</button></div><div id="scopeBox" class="scopebox hidden"><div class="scopegrid">${SCOPES.map(([k,n])=>`<button class="chip ${searchState.scopes.includes(k)?'active':''}" data-scope="${k}">${n}</button>`).join('')}</div></div><div class="filters"><select class="chip" id="typeFilter"><option>전체</option>${TYPES.map(x=>`<option ${x===searchState.type?'selected':''}>${x}</option>`).join('')}</select><select class="chip" id="genreFilter"><option>전체</option>${genres.map(x=>`<option ${x===searchState.genre?'selected':''}>${esc(x)}</option>`).join('')}</select><button class="chip ${searchState.favorite?'active':''}" id="favFilter">★</button><select class="chip" id="sort"><option value="updated" ${searchState.sort==='updated'?'selected':''}>최근 수정</option><option value="created" ${searchState.sort==='created'?'selected':''}>최근 등록</option><option value="title" ${searchState.sort==='title'?'selected':''}>제목순</option></select></div><div class="grid">${a.map(cardHTML).join('')}</div>${!a.length?'<div class="empty">작품이 없습니다.</div>':''}`;
$('#search').oninput=e=>{searchState.q=e.target.value;renderLibrary()};$('#scopeBtn').onclick=()=>$('#scopeBox').classList.toggle('hidden');document.querySelectorAll('[data-scope]').forEach(b=>b.onclick=()=>{let s=b.dataset.scope;if(s==='all')searchState.scopes=['all'];else{searchState.scopes=searchState.scopes.filter(x=>x!=='all');searchState.scopes.includes(s)?searchState.scopes=searchState.scopes.filter(x=>x!==s):searchState.scopes.push(s);if(!searchState.scopes.length)searchState.scopes=['all']}renderLibrary();$('#scopeBox').classList.remove('hidden')});$('#typeFilter').onchange=e=>{searchState.type=e.target.value;renderLibrary()};$('#genreFilter').onchange=e=>{searchState.genre=e.target.value;renderLibrary()};$('#favFilter').onclick=()=>{searchState.favorite=!searchState.favorite;renderLibrary()};$('#sort').onchange=e=>{searchState.sort=e.target.value;renderLibrary()};document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{editing=works.find(w=>w.id===b.dataset.open);render()});document.querySelectorAll('[data-star]').forEach(b=>b.onclick=async e=>{e.stopPropagation();let w=works.find(x=>x.id===b.dataset.star);w.favorite=!w.favorite;w.updatedAt=new Date().toISOString();await putDB(w);renderLibrary()})}
function cardHTML(w){let q=searchState.q.trim();let match='';if(q){let scopes=searchState.scopes.includes('all')?SCOPES.slice(1).map(x=>x[0]):searchState.scopes;for(let s of scopes){let text=workText(w,s);let i=text.toLowerCase().indexOf(q.toLowerCase());if(i>=0){let sn=text.slice(Math.max(0,i-35),i+q.length+55);match=`<div class="match"><b>${esc(SCOPES.find(x=>x[0]===s)?.[1]||s)}</b> · ${esc(sn)}</div>`;break}}}return `<article class="card" data-open="${w.id}"><div style="display:flex;gap:8px"><h3>${esc(w.title||'제목 없음')}</h3><div class="spacer"></div><button class="star" data-star="${w.id}">${w.favorite?'★':'☆'}</button></div><div class="meta">${esc(w.type)} · ${esc(w.genre)}${w.length?' · '+esc(w.length)+(isSeries(w)?'부작':'분'):''}</div>${w.hook?`<div class="hook">${esc(w.hook)}</div>`:''}${w.logline?`<div class="logline">${esc(w.logline)}</div>`:''}<div class="tags">${w.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>${match}</article>`}
function field(label,key,val='',type='textarea'){return `<div class="field"><label>${label}</label>${type==='textarea'?`<textarea data-key="${key}">${esc(val)}</textarea>`:`<input data-key="${key}" value="${esc(val)}">`}</div>`}
function renderEditor(w){ensureEpisodes(w);let series=isSeries(w);$('#main').innerHTML=`<div class="panel"><div class="titleline"><input id="title" value="${esc(w.title)}" placeholder="제목"><button class="cast-toggle" id="castToggle">▸</button><div class="spacer"></div><button class="star" id="editorStar">${w.favorite?'★':'☆'}</button></div><div id="castBox" class="castbox hidden"></div><div class="row" style="margin-top:12px"><div class="field"><label>형식</label><select id="type">${TYPES.map(x=>`<option ${x===w.type?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>장르</label><select id="genre">${genres.map(x=>`<option ${x===w.genre?'selected':''}>${esc(x)}</option>`).join('')}</select></div></div><div class="field"><label>${series?'회차':'러닝타임'}</label><div style="display:flex;align-items:center;gap:7px"><input id="length" type="number" min="0" value="${esc(w.length)}" style="width:130px"><span>${series?'부작':'분'}</span></div></div>${field('태그 (쉼표로 구분)','tags',w.tags.join(', '),'input')}${field('후킹','hook',w.hook)}${field('로그라인','logline',w.logline)}</div>${series?seriesHTML(w):singleHTML(w)}<div style="display:flex;gap:8px;justify-content:space-between;margin:18px 0"><button class="btn" id="backBtn">← 라이브러리</button><button class="btn danger" id="deleteBtn">작품 삭제</button></div><div class="savebar"><span class="saved" id="saved">저장됨</span></div>`;
renderCast(w);bindEditor(w)}
function singleHTML(w){return `<div class="panel"><div class="section-title">Q&A</div><div id="qaList">${qaHTML(w.qa)}</div><button class="mini" data-addqa="root">＋ Q&A</button></div><div class="panel"><div class="section-title">기승전결</div>${['gi','seung','jeon','gyeol'].map((k,i)=>field(['기','승','전','결'][i],'acts.'+k,w.acts[k])).join('')}</div><div class="panel"><div class="section-title">POINT</div>${POINTS.map(([k,n])=>field(n,'points.'+k,w.points[k])).join('')}</div><div class="panel">${field('캐릭터','characters',w.characters)}${field('CHECK','check',w.check)}</div>`}
function seriesHTML(w){return `<div class="panel"><div class="section-title">EPISODE MAP</div>${w.episodes.map((e,i)=>`<div class="episode-summary"><b>${i+1}화</b><input data-ep="${i}" data-epkey="summary" value="${esc(e.summary)}" placeholder="한 줄 스토리"></div>`).join('')}</div><div class="panel"><div class="episode-tabs">${w.episodes.map((e,i)=>`<button class="chip ${i===0?'active':''}" data-eptab="${i}">${i+1}화</button>`).join('')}</div><div id="episodeEditor"></div></div>`}
function episodeEditorHTML(e,i){return `${field('STORY',`ep.${i}.story`,e.story)}<div class="section-title">Q&A</div><div id="epQaList">${qaHTML(e.qa,'ep',i)}</div><button class="mini" data-addqa="ep" data-epi="${i}">＋ Q&A</button><div class="sep"></div><div class="section-title">POINT</div>${POINTS.map(([k,n])=>field(n,`ep.${i}.points.${k}`,e.points[k])).join('')}${field('CHECK',`ep.${i}.check`,e.check)}`}
function qaHTML(arr,mode='root',epi=''){return arr.map((x,i)=>`<div class="panel" style="padding:9px"><div class="field"><label>Q</label><textarea data-qa="${i}" data-qakey="q" data-qamode="${mode}" data-epi="${epi}">${esc(x.q)}</textarea></div><div class="field"><label>A</label><textarea data-qa="${i}" data-qakey="a" data-qamode="${mode}" data-epi="${epi}">${esc(x.a)}</textarea></div><button class="mini danger" data-delqa="${i}" data-qamode="${mode}" data-epi="${epi}">삭제</button></div>`).join('')}
function renderCast(w){let box=$('#castBox');box.innerHTML=`${w.cast.map((x,i)=>`<div class="itemrow"><input data-cast="${i}" data-castkey="name" value="${esc(x.name)}" placeholder="인물"><input data-cast="${i}" data-castkey="actor" value="${esc(x.actor)}" placeholder="배우"><button class="mini" data-delcast="${i}">×</button></div>`).join('')}<button class="mini" id="addCast">＋</button>`;box.querySelectorAll('input').forEach(x=>x.oninput=()=>{w.cast[+x.dataset.cast][x.dataset.castkey]=x.value;save(w)});box.querySelectorAll('[data-delcast]').forEach(b=>b.onclick=()=>{w.cast.splice(+b.dataset.delcast,1);renderCast(w);save(w)});$('#addCast').onclick=()=>{w.cast.push({name:'',actor:''});renderCast(w);save(w)}}
function bindEditor(w){let epIndex=0;$('#castToggle').onclick=()=>{let b=$('#castBox');b.classList.toggle('hidden');$('#castToggle').textContent=b.classList.contains('hidden')?'▸':'▾'};$('#title').oninput=e=>{w.title=e.target.value;save(w)};$('#type').onchange=e=>{w.type=e.target.value;ensureEpisodes(w);save(w);renderEditor(w)};$('#genre').onchange=e=>{w.genre=e.target.value;save(w)};$('#length').onchange=e=>{w.length=e.target.value;ensureEpisodes(w);save(w);renderEditor(w)};$('#editorStar').onclick=()=>{w.favorite=!w.favorite;save(w);renderEditor(w)};bindDataFields(w);bindQA(w);if(isSeries(w)){renderEpisode(w,0);document.querySelectorAll('[data-eptab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-eptab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderEpisode(w,+b.dataset.eptab)});document.querySelectorAll('[data-ep]').forEach(x=>x.oninput=()=>{w.episodes[+x.dataset.ep][x.dataset.epkey]=x.value;save(w)})}$('#backBtn').onclick=()=>{editing=null;render()};$('#deleteBtn').onclick=async()=>{if(confirm('이 작품을 삭제할까요?')){await delDB(w.id);works=works.filter(x=>x.id!==w.id);editing=null;render()}}}
function bindDataFields(w,root=document){root.querySelectorAll('[data-key]').forEach(x=>x.oninput=()=>{let k=x.dataset.key;if(k==='tags')w.tags=x.value.split(',').map(s=>s.trim()).filter(Boolean);else{let [a,b]=k.split('.');if(b)w[a][b]=x.value;else w[k]=x.value}save(w)})}
function bindQA(w,root=document){root.querySelectorAll('[data-qa]').forEach(x=>x.oninput=()=>{let arr=x.dataset.qamode==='ep'?w.episodes[+x.dataset.epi].qa:w.qa;arr[+x.dataset.qa][x.dataset.qakey]=x.value;save(w)});root.querySelectorAll('[data-addqa]').forEach(b=>b.onclick=()=>{let arr=b.dataset.addqa==='ep'?w.episodes[+b.dataset.epi].qa:w.qa;arr.push({q:'',a:''});save(w);if(b.dataset.addqa==='ep')renderEpisode(w,+b.dataset.epi);else renderEditor(w)});root.querySelectorAll('[data-delqa]').forEach(b=>b.onclick=()=>{let arr=b.dataset.qamode==='ep'?w.episodes[+b.dataset.epi].qa:w.qa;arr.splice(+b.dataset.delqa,1);save(w);if(b.dataset.qamode==='ep')renderEpisode(w,+b.dataset.epi);else renderEditor(w)})}
function renderEpisode(w,i){let root=$('#episodeEditor');root.innerHTML=episodeEditorHTML(w.episodes[i],i);bindDataFields(w,root);root.querySelectorAll('[data-key]').forEach(x=>x.oninput=()=>{let p=x.dataset.key.split('.');if(p[0]==='ep'){let e=w.episodes[+p[1]];if(p[2]==='points')e.points[p[3]]=x.value;else e[p[2]]=x.value;save(w)}});bindQA(w,root)}
let saveTimer;function save(w){w.updatedAt=new Date().toISOString();clearTimeout(saveTimer);let s=$('#saved');if(s)s.textContent='저장 중…';saveTimer=setTimeout(async()=>{await putDB(w);let i=works.findIndex(x=>x.id===w.id);if(i<0)works.push(w);else works[i]=w;if(s)s.textContent='저장됨'},250)}
function renderCollect(){let opts=[['hook','후킹'],['logline','로그라인'],['qa','Q&A'],...POINTS.map(([k,n])=>['point:'+k,n]),['check','CHECK']];$('#main').innerHTML=`<div class="panel"><div class="row"><div class="field"><label>모아보기</label><select id="collectType">${opts.map(([k,n])=>`<option value="${k}">${n}</option>`).join('')}</select></div><div class="field"><label>형식</label><select id="collectForm"><option>전체</option>${TYPES.map(x=>`<option>${x}</option>`).join('')}</select></div></div><div class="field"><label>태그 필터 (쉼표, 모두 포함)</label><input id="collectTags" placeholder="복수, 가족"></div></div><div id="collectResults"></div>`;['collectType','collectForm','collectTags'].forEach(id=>$('#'+id).oninput=renderCollectResults);renderCollectResults()}
function renderCollectResults(){let ct=$('#collectType').value, form=$('#collectForm').value, tags=$('#collectTags').value.split(',').map(x=>x.trim()).filter(Boolean);let rows=[];works.filter(w=>(form==='전체'||w.type===form)&&tags.every(t=>w.tags.includes(t))).forEach(w=>{let add=(label,text)=>{if(text)rows.push({w,label,text})};if(ct==='hook')add('',w.hook);else if(ct==='logline')add('',w.logline);else if(ct==='check'){add('CHECK',w.check);w.episodes.forEach(e=>add(`${e.number}화 CHECK`,e.check))}else if(ct==='qa'){w.qa.forEach(x=>add('Q&A',`Q. ${x.q}\nA. ${x.a}`));w.episodes.forEach(e=>e.qa.forEach(x=>add(`${e.number}화 Q&A`,`Q. ${x.q}\nA. ${x.a}`)))}else if(ct.startsWith('point:')){let k=ct.split(':')[1],n=POINTS.find(x=>x[0]===k)[1];add(n,w.points[k]);w.episodes.forEach(e=>add(`${e.number}화 ${n}`,e.points[k]))}});$('#collectResults').innerHTML=rows.length?rows.map(r=>`<div class="card" style="margin-bottom:10px"><b>${esc(r.w.title)}</b>${r.label?` <span class="meta">${esc(r.label)}</span>`:''}<div style="white-space:pre-wrap;margin-top:7px">${esc(r.text)}</div></div>`).join(''):'<div class="empty">기록된 내용이 없습니다.</div>'}
function renderSettings(){let last=localStorage.getItem('storydb_lastbackup');$('#main').innerHTML=`<div class="settings-grid"><div class="panel"><div class="section-title">데이터</div><p class="notice">${last?'마지막 전체 백업: '+new Date(last).toLocaleString():'아직 전체 백업 기록이 없습니다.'}</p><div class="filters"><button class="btn" id="exportAll">전체 JSON 백업</button><button class="btn" id="importAll">JSON 불러오기</button><button class="btn" id="exportCSV">CSV 내보내기</button></div><input type="file" id="fileInput" accept=".json" class="hidden"><div class="sep"></div><button class="btn danger" id="resetAll">전체 초기화</button></div><div class="panel"><div class="section-title">장르 관리</div><div id="genreList">${genres.map((g,i)=>`<div class="listedit"><input value="${esc(g)}" data-genre="${i}"><button class="mini" data-delgenre="${i}">×</button></div>`).join('')}</div><button class="mini" id="addGenre">＋ 장르</button></div></div><div class="panel"><div class="section-title">작품별 JSON</div><select id="workPick" style="width:100%;padding:9px;border:1px solid var(--line);border-radius:9px"><option value="">작품 선택</option>${works.map(w=>`<option value="${w.id}">${esc(w.title||'제목 없음')}</option>`).join('')}</select><div class="filters" style="margin-top:9px"><button class="btn" id="exportOne">선택 작품 내보내기</button><button class="btn" id="importOne">작품 JSON 불러오기</button></div></div>`;
$('#exportAll').onclick=()=>{downloadJSON({app:'story-db',dataVersion:1,exportedAt:new Date().toISOString(),works,genres},'story-db-backup.json');localStorage.setItem('storydb_lastbackup',new Date().toISOString());renderSettings()};$('#importAll').onclick=()=>{$('#fileInput').dataset.mode='all';$('#fileInput').click()};$('#importOne').onclick=()=>{$('#fileInput').dataset.mode='one';$('#fileInput').click()};$('#fileInput').onchange=importJSON;$('#exportOne').onclick=()=>{let w=works.find(x=>x.id===$('#workPick').value);if(w)downloadJSON({app:'story-db-work',dataVersion:1,work:w},safeName(w.title)+'.json')};$('#exportCSV').onclick=exportCSV;$('#resetAll').onclick=async()=>{if(confirm('모든 작품을 삭제합니다. JSON 백업을 확인했나요?')&&confirm('정말 전체 초기화할까요?')){let tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).clear();tx.oncomplete=()=>{works=[];renderSettings()}}};document.querySelectorAll('[data-genre]').forEach(x=>x.onchange=()=>{genres[+x.dataset.genre]=x.value.trim()||'기타';saveGenres();renderSettings()});document.querySelectorAll('[data-delgenre]').forEach(b=>b.onclick=()=>{if(genres.length>1){genres.splice(+b.dataset.delgenre,1);saveGenres();renderSettings()}});$('#addGenre').onclick=()=>{genres.push('새 장르');saveGenres();renderSettings()}}
function saveGenres(){localStorage.setItem('storydb_genres',JSON.stringify(genres))}
function downloadJSON(obj,name){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
function safeName(s){return (s||'work').replace(/[\\/:*?"<>|]/g,'_')}
async function importJSON(e){let f=e.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text());let mode=e.target.dataset.mode;if(mode==='all'){let incoming=Array.isArray(data)?data:(data.works||[]);if(!incoming.length)throw Error('작품 데이터 없음');if(confirm(`${incoming.length}개 작품을 불러옵니다. 같은 ID는 덮어씁니다.`)){for(let w of incoming){migrate(w);await putDB(w)}if(data.genres){genres=data.genres;saveGenres()}works=await allDB();renderSettings()}}else{let w=data.work||data;migrate(w);let old=works.find(x=>x.id===w.id);if(old&&!confirm('같은 작품 ID가 있습니다. 덮어쓸까요?\n취소를 누르면 복사본으로 추가합니다.'))w.id=uid();await putDB(w);works=await allDB();renderSettings()}}catch(err){alert('JSON을 읽지 못했습니다: '+err.message)}e.target.value=''}
function migrate(w){w.dataVersion=w.dataVersion||1;w.id=w.id||uid();w.tags=w.tags||[];w.cast=w.cast||[];w.qa=w.qa||[];w.acts=w.acts||{gi:'',seung:'',jeon:'',gyeol:''};w.points=w.points||Object.fromEntries(POINTS.map(([k])=>[k,'']));w.episodes=w.episodes||[];w.createdAt=w.createdAt||new Date().toISOString();w.updatedAt=w.updatedAt||w.createdAt;return w}
function exportCSV(){let head=['제목','형식','장르','러닝타임/회차','태그','후킹','로그라인','기','승','전','결','오프닝','발단','주요 장애물','PUSH','중간점','절정','엔드','캐릭터','CHECK'];let rows=works.map(w=>[w.title,w.type,w.genre,w.length,w.tags.join('|'),w.hook,w.logline,w.acts.gi,w.acts.seung,w.acts.jeon,w.acts.gyeol,w.points.opening,w.points.inciting,w.points.obstacle,w.points.push,w.points.midpoint,w.points.climax,w.points.end,w.characters,w.check]);let csv='\uFEFF'+[head,...rows].map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='story-db.csv';a.click();URL.revokeObjectURL(a.href)}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{editing=null;currentView=t.dataset.view;render()});$('#newBtn').onclick=()=>{editing=blank();works.push(editing);putDB(editing);render()};
(async()=>{await openDB();works=(await allDB()).map(migrate);render()})().catch(e=>{$('#main').innerHTML='<div class="empty">데이터베이스를 열지 못했습니다.<br>'+esc(e.message)+'</div>'});
</script></body></html>
