<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>STORY DB</title>
<style>
:root{--bg:#e9e8e4;--panel:#f5f4f1;--card:#fffefa;--line:#d4d2cc;--text:#262626;--muted:#77746e;--accent:#4d555b;--soft:#deddda;--danger:#8b4545;--shadow:0 8px 24px rgba(30,30,30,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR","Segoe UI",sans-serif;line-height:1.55}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}.app{max-width:1180px;margin:auto;min-height:100vh}.top{position:sticky;top:0;z-index:20;background:rgba(233,232,228,.94);backdrop-filter:blur(12px);padding:14px 16px 10px;border-bottom:1px solid var(--line)}.brandrow{display:flex;align-items:center;gap:10px}.brand{font-weight:850;letter-spacing:.08em}.spacer{flex:1}.iconbtn,.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 11px}.iconbtn{min-width:40px}.primary{background:var(--accent);color:white;border-color:var(--accent)}.danger{color:var(--danger)}.tabs{display:flex;gap:6px;margin-top:10px;overflow:auto}.tab{border:0;background:transparent;padding:7px 10px;border-radius:8px;color:var(--muted);white-space:nowrap}.tab.active{background:var(--card);color:var(--text);font-weight:700}.main{padding:16px}.toolbar{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:10px}.search{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 13px}.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.chip,.mini{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 10px;font-size:13px}.chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}.card h3{margin:0;font-size:18px}.meta{font-size:12px;color:var(--muted);margin-top:3px}.hook{font-size:14px;color:var(--muted);white-space:pre-wrap;margin:5px 0}.logline{font-weight:750;color:#343434;white-space:pre-wrap;margin:10px 0 4px}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}.tag{font-size:12px;background:var(--soft);padding:3px 7px;border-radius:999px}.cardfoot{display:flex;align-items:center;gap:6px;margin-top:12px}.star{border:0;background:transparent;font-size:21px;padding:0 4px}.empty{text-align:center;color:var(--muted);padding:70px 20px}.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:12px}.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field{margin-bottom:12px}.field label,.section-title{display:block;font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.04em;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 10px}.field textarea{min-height:86px;resize:vertical}.titleline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.date-input{width:142px!important;font-size:13px!important;font-weight:500!important;border:1px solid var(--line)!important;border-radius:8px!important;padding:6px 8px!important;background:var(--panel)!important}.titleline input{font-size:22px;font-weight:800;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:4px 0}.cast-toggle{border:0;background:transparent;padding:3px;font-size:18px}.castbox{margin-top:10px}.itemrow{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;margin-bottom:6px}.itemrow.one{grid-template-columns:1fr auto}.sep{height:1px;background:var(--line);margin:14px 0}.accordion{border-top:1px solid var(--line)}.acc-head{width:100%;display:flex;justify-content:space-between;border:0;background:transparent;padding:12px 0;font-weight:800}.acc-body{padding-bottom:10px}.hidden{display:none!important}.savebar{position:sticky;bottom:10px;display:flex;justify-content:flex-end;pointer-events:none}.saved{background:#333;color:#fff;border-radius:999px;padding:6px 10px;font-size:12px;opacity:.88}.episode-tabs{display:flex;gap:6px;overflow:auto;padding-bottom:8px}.episode-tabs button{white-space:nowrap}.episode-summary{display:grid;grid-template-columns:56px 1fr;gap:7px;align-items:center;margin-bottom:7px}.scopebox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}.scopegrid{display:flex;gap:6px;flex-wrap:wrap}.match{border-left:3px solid #8b8f92;padding-left:10px;margin-top:8px;font-size:13px;color:#505050}.match mark{background:#d8d6cc}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.listedit{display:flex;gap:6px;margin-bottom:6px}.listedit input{flex:1}.notice{font-size:13px;color:var(--muted)}
@media(max-width:650px){.main{padding:12px}.top{padding:11px 12px 8px}.grid{grid-template-columns:1fr}.row,.settings-grid{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr auto}.panel{padding:13px}.itemrow{grid-template-columns:1fr 1fr auto}.titleline input{font-size:20px}.hide-mobile{display:none}}
</style>
</head>
<body><div class="app">
<header class="top"><div class="brandrow"><div class="brand">STORY DB</div><div class="spacer"></div><button class="btn primary" id="newBtn">＋ 작품</button></div><nav class="tabs"><button class="tab active" data-view="library">라이브러리</button><button class="tab" data-view="collect">모아보기</button><button class="tab" data-view="settings">설정</button></nav></header>
<main class="main" id="main"></main></div>
<script>
const DB_NAME='storyReferenceDB', DB_VERSION=1, STORE='works', DATA_VERSION=3;
const DEFAULT_GENRES=['드라마','코미디','로맨스','스릴러','미스터리','범죄','액션','공포','SF','판타지','가족','시대극','기타'];
const TYPES=['영화','시리즈','단막','단편'];
const POINTS=[['opening','오프닝'],['inciting','발단'],['obstacle','주요 장애물'],['push','PUSH'],['midpoint','중간점'],['climax','절정'],['end','엔드']];
const SCOPES=[['all','전체'],['title','제목'],['date','감상일'],['tags','태그'],['logline','로그라인'],['hook','후킹'],['characters','CHARACTER'],['qa','Q&A'],['story','기승전결'],['opening','오프닝'],['inciting','발단'],['obstacle','주요 장애물'],['push','PUSH'],['midpoint','중간점'],['climax','절정'],['end','엔드'],['check','CHECK'],['cast','등장인물']];
let db, works=[], currentView='library', editing=null, searchState={q:'',scopes:['all'],type:'전체',genre:'전체',progress:'전체',favorite:false,sort:'updated'};
let genres=JSON.parse(localStorage.getItem('storydb_genres')||'null')||DEFAULT_GENRES.slice();
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2)}
function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=()=>{let d=r.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:'id'})};r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}
function allDB(){return new Promise((res,rej)=>{let r=db.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function putDB(w){return new Promise((res,rej)=>{let r=db.transaction(STORE,'readwrite').objectStore(STORE).put(w);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function delDB(id){return new Promise((res,rej)=>{let r=db.transaction(STORE,'readwrite').objectStore(STORE).delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function blank(){let now=new Date().toISOString();return{id:uid(),dataVersion:1,title:'',type:'영화',genre:'드라마',length:'',watchedEpisodes:'',tags:[],hook:'',logline:'',cast:[],qa:[],acts:{gi:'',seung:'',jeon:'',gyeol:''},points:Object.fromEntries(POINTS.map(([k])=>[k,''])),characters:'',check:'',episodes:[],favorite:false,createdAt:now,updatedAt:now}}
function isSeries(w){return w.type==='시리즈'}
function ensureEpisodes(w){if(!isSeries(w))return;let total=Math.max(0,parseInt(w.length)||0),seen=Math.max(0,parseInt(w.watchedEpisodes)||0),n=Math.max(1,Math.min(total||seen||1,Math.max(seen,1)));while(w.episodes.length<n)w.episodes.push({number:w.episodes.length+1,summary:'',qaText:'',acts:{gi:'',seung:'',jeon:'',gyeol:''},points:Object.fromEntries(POINTS.map(([k])=>[k,''])),check:''});if(total&&w.episodes.length>total)w.episodes=w.episodes.slice(0,total)}
function render(){document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view===currentView)); if(editing)return renderEditor(editing); if(currentView==='library')renderLibrary(); else if(currentView==='collect')renderCollect(); else renderSettings()}
function workText(w,scope){let vals=[];if(scope==='title')vals=[w.title];if(scope==='date')vals=[w.watchedDate];if(scope==='tags')vals=w.tags;if(scope==='hook')vals=[w.hook];if(scope==='logline')vals=[w.logline];if(scope==='cast')vals=[w.castText];if(scope==='characters')vals=[w.characters];if(scope==='qa')vals=[w.qaText];if(scope==='check')vals=[w.check];if(scope==='story')vals=[...Object.values(w.acts||{})];let pk=POINTS.find(x=>x[0]===scope)?.[0];if(pk)vals=[w.points?.[pk]];if(isSeries(w)){if(scope==='story')vals.push(...w.episodes.flatMap(e=>Object.values(e.acts||{})));if(scope==='qa')vals.push(...w.episodes.map(e=>e.qaText));if(scope==='check')vals.push(...w.episodes.map(e=>e.check));if(pk)vals.push(...w.episodes.map(e=>e.points?.[pk]))}return vals.filter(Boolean).join(' ')}
function searchable(w){return SCOPES.slice(1).map(([s])=>workText(w,s)).join(' ')}
function filtered(){let q=searchState.q.trim().toLowerCase();let a=works.filter(w=>{if(searchState.type!=='전체'&&w.type!==searchState.type)return false;if(searchState.genre!=='전체'&&w.genre!==searchState.genre)return false;if(searchState.progress!=='전체'){if(!isSeries(w))return false;let total=parseInt(w.length)||0,seen=parseInt(w.watchedEpisodes)||0;if(searchState.progress==='보는 중'&&!(total>0&&seen<total))return false;if(searchState.progress==='완주'&&!(total>0&&seen>=total))return false}if(searchState.favorite&&!w.favorite)return false;if(q){let scopes=searchState.scopes.includes('all')?SCOPES.slice(1).map(x=>x[0]):searchState.scopes;if(!scopes.some(s=>workText(w,s).toLowerCase().includes(q)))return false}return true});a.sort((x,y)=>{if(searchState.sort==='title')return x.title.localeCompare(y.title,'ko');if(searchState.sort==='dateDesc')return (y.watchedDate||'').localeCompare(x.watchedDate||'')||(!y.watchedDate)-(!x.watchedDate);if(searchState.sort==='dateAsc'){if(!x.watchedDate)return 1;if(!y.watchedDate)return -1;return x.watchedDate.localeCompare(y.watchedDate)}return y.updatedAt.localeCompare(x.updatedAt)});return a}
function renderLibrary(){let a=filtered();$('#main').innerHTML=`<div class="toolbar"><input class="search" id="search" placeholder="검색" value="${esc(searchState.q)}"><button class="btn" id="scopeBtn">범위</button></div><div id="scopeBox" class="scopebox hidden"><div class="scopegrid">${SCOPES.map(([k,n])=>`<button class="chip ${searchState.scopes.includes(k)?'active':''}" data-scope="${k}">${n}</button>`).join('')}</div></div><div class="filters"><select class="chip" id="typeFilter"><option>전체</option>${TYPES.map(x=>`<option ${x===searchState.type?'selected':''}>${x}</option>`).join('')}</select><select class="chip" id="genreFilter"><option>전체</option>${genres.map(x=>`<option ${x===searchState.genre?'selected':''}>${esc(x)}</option>`).join('')}</select>${searchState.type==='시리즈'?`<select class="chip" id="progressFilter"><option ${searchState.progress==='전체'?'selected':''}>전체</option><option ${searchState.progress==='보는 중'?'selected':''}>보는 중</option><option ${searchState.progress==='완주'?'selected':''}>완주</option></select>`:''}<button class="chip ${searchState.favorite?'active':''}" id="favFilter">★</button><select class="chip" id="sort"><option value="updated" ${searchState.sort==='updated'?'selected':''}>최근순</option><option value="dateDesc" ${searchState.sort==='dateDesc'?'selected':''}>감상일 최신순</option><option value="dateAsc" ${searchState.sort==='dateAsc'?'selected':''}>감상일 오래된순</option><option value="title" ${searchState.sort==='title'?'selected':''}>제목순</option></select></div><div class="grid">${a.map(cardHTML).join('')}</div>${!a.length?'<div class="empty">작품이 없습니다.</div>':''}`;
$('#search').oninput=e=>{searchState.q=e.target.value;renderLibrary()};$('#scopeBtn').onclick=()=>$('#scopeBox').classList.toggle('hidden');document.querySelectorAll('[data-scope]').forEach(b=>b.onclick=()=>{let s=b.dataset.scope;if(s==='all')searchState.scopes=['all'];else{searchState.scopes=searchState.scopes.filter(x=>x!=='all');searchState.scopes.includes(s)?searchState.scopes=searchState.scopes.filter(x=>x!==s):searchState.scopes.push(s);if(!searchState.scopes.length)searchState.scopes=['all']}renderLibrary();$('#scopeBox').classList.remove('hidden')});$('#typeFilter').onchange=e=>{searchState.type=e.target.value;if(searchState.type!=='시리즈')searchState.progress='전체';renderLibrary()};if($('#progressFilter'))$('#progressFilter').onchange=e=>{searchState.progress=e.target.value;renderLibrary()};$('#genreFilter').onchange=e=>{searchState.genre=e.target.value;renderLibrary()};$('#favFilter').onclick=()=>{searchState.favorite=!searchState.favorite;renderLibrary()};$('#sort').onchange=e=>{searchState.sort=e.target.value;renderLibrary()};document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{editing=works.find(w=>w.id===b.dataset.open);render()});document.querySelectorAll('[data-star]').forEach(b=>b.onclick=async e=>{e.stopPropagation();let w=works.find(x=>x.id===b.dataset.star);w.favorite=!w.favorite;w.updatedAt=new Date().toISOString();await putDB(w);renderLibrary()})}
function cardHTML(w){let q=searchState.q.trim();let match='';if(q){let scopes=searchState.scopes.includes('all')?SCOPES.slice(1).map(x=>x[0]):searchState.scopes;for(let sc of scopes){let text=workText(w,sc);let i=text.toLowerCase().indexOf(q.toLowerCase());if(i>=0){let sn=text.slice(Math.max(0,i-35),i+q.length+55);match=`<div class="match"><b>${esc(SCOPES.find(x=>x[0]===sc)?.[1]||sc)}</b> · ${esc(sn)}</div>`;break}}}return `<article class="card" data-open="${w.id}"><div style="display:flex;gap:8px"><h3>${esc(w.title||'제목 없음')}</h3><div class="spacer"></div><button class="star" data-star="${w.id}">${w.favorite?'★':'☆'}</button></div><div class="meta">${esc(w.type)} · ${esc(w.genre)}${w.length?' · '+(isSeries(w)?esc(w.watchedEpisodes||0)+'/'+esc(w.length)+'화':esc(w.length)+'분'):''}${w.watchedDate?' · '+esc(w.watchedDate):''}</div>${w.logline?`<div class="logline">${esc(w.logline)}</div>`:''}${w.hook?`<div class="hook">${esc(w.hook)}</div>`:''}<div class="tags">${w.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>${match}</article>`}
function field(label,key,val='',type='textarea'){return `<div class="field"><label>${label}</label>${type==='textarea'?`<textarea data-key="${key}">${esc(val)}</textarea>`:`<input data-key="${key}" value="${esc(val)}">`}</div>`}
function renderEditor(w){ensureEpisodes(w);let series=isSeries(w);$('#main').innerHTML=`<div class="panel"><div class="titleline"><input id="title" value="${esc(w.title)}" placeholder="제목"><input class="date-input" id="watchedDate" type="date" value="${esc(w.watchedDate||'')}" title="감상일"><button class="cast-toggle" id="castToggle">▸</button><div class="spacer"></div><button class="star" id="editorStar">${w.favorite?'★':'☆'}</button></div><div id="castBox" class="castbox hidden"><textarea id="castText" placeholder="등장인물 메모" style="width:100%;min-height:70px;border:1px solid var(--line);border-radius:9px;padding:9px 10px">${esc(w.castText||'')}</textarea></div><div class="row" style="margin-top:12px"><div class="field"><label>형식</label><select id="type">${TYPES.map(x=>`<option ${x===w.type?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>장르</label><select id="genre">${genres.map(x=>`<option ${x===w.genre?'selected':''}>${esc(x)}</option>`).join('')}</select></div></div>${series?`<div class="row"><div class="field"><label>총 회차</label><div style="display:flex;align-items:center;gap:7px"><input id="length" type="number" min="0" value="${esc(w.length)}" style="width:130px"><span>부작</span></div></div><div class="field"><label>본 회차</label><div style="display:flex;align-items:center;gap:7px"><input id="watchedEpisodes" type="number" min="0" ${w.length?`max="${esc(w.length)}"`:''} value="${esc(w.watchedEpisodes||'')}" style="width:130px"><span>화</span></div></div></div>`:`<div class="field"><label>러닝타임</label><div style="display:flex;align-items:center;gap:7px"><input id="length" type="number" min="0" value="${esc(w.length)}" style="width:130px"><span>분</span></div></div>`}${field('태그 (쉼표로 구분)','tags',w.tags.join(', '),'input')}${field('로그라인','logline',w.logline)}${field('후킹','hook',w.hook)}${field('CHARACTER','characters',w.characters)}</div>${series?seriesHTML(w):singleHTML(w)}<div style="display:flex;gap:8px;justify-content:space-between;margin:18px 0"><button class="btn" id="backBtn">← 라이브러리</button><button class="btn danger" id="deleteBtn">작품 삭제</button></div><div class="savebar"><span class="saved" id="saved">저장됨</span></div>`;bindEditor(w)}
function singleHTML(w){return `<div class="panel">${field('Q&A','qaText',w.qaText)}</div><div class="panel">${['gi','seung','jeon','gyeol'].map((k,i)=>field(['기','승','전','결'][i],'acts.'+k,w.acts[k])).join('')}</div><div class="panel">${POINTS.map(([k,n])=>field(n,'points.'+k,w.points[k])).join('')}</div><div class="panel">${field('CHECK','check',w.check)}</div>`}
function seriesHTML(w){return `<div class="panel"><div class="section-title">EPISODE MAP</div>${w.episodes.map((e,i)=>`<div class="episode-summary"><b>${i+1}화</b><input data-ep="${i}" data-epkey="summary" value="${esc(e.summary)}" placeholder="한 줄 스토리"></div>`).join('')}</div><div class="panel"><div class="episode-tabs">${w.episodes.map((e,i)=>`<button class="chip ${i===0?'active':''}" data-eptab="${i}">${i+1}화</button>`).join('')}</div><div id="episodeEditor"></div></div>`}
function episodeEditorHTML(e,i,total){return `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><button class="mini" data-prev="${i}" ${i===0?'disabled':''}>‹ 이전 화</button><b>${i+1}화</b><button class="mini" data-next="${i}" ${i===total-1?'disabled':''}>다음 화 ›</button></div>${field('Q&A',`ep.${i}.qaText`,e.qaText)}<div class="sep"></div>${['gi','seung','jeon','gyeol'].map((k,j)=>field(['기','승','전','결'][j],`ep.${i}.acts.${k}`,e.acts[k])).join('')}<div class="sep"></div>${POINTS.map(([k,n])=>field(n,`ep.${i}.points.${k}`,e.points[k])).join('')}${field('CHECK',`ep.${i}.check`,e.check)}`}
function bindEditor(w){$('#castToggle').onclick=()=>{let b=$('#castBox');b.classList.toggle('hidden');$('#castToggle').textContent=b.classList.contains('hidden')?'▸':'▾'};$('#castText').oninput=e=>{w.castText=e.target.value;save(w)};$('#title').oninput=e=>{w.title=e.target.value;save(w)};$('#watchedDate').onchange=e=>{w.watchedDate=e.target.value;save(w)};$('#type').onchange=e=>{w.type=e.target.value;ensureEpisodes(w);save(w);renderEditor(w)};$('#genre').onchange=e=>{w.genre=e.target.value;save(w)};$('#length').onchange=e=>{w.length=e.target.value;if(isSeries(w)){let total=parseInt(w.length)||0;if(total&&parseInt(w.watchedEpisodes)>total)w.watchedEpisodes=String(total);ensureEpisodes(w)}save(w);renderEditor(w)};if($('#watchedEpisodes'))$('#watchedEpisodes').onchange=e=>{let total=parseInt(w.length)||0,seen=Math.max(0,parseInt(e.target.value)||0);if(total)seen=Math.min(seen,total);w.watchedEpisodes=String(seen);ensureEpisodes(w);save(w);renderEditor(w)};$('#editorStar').onclick=()=>{w.favorite=!w.favorite;save(w);renderEditor(w)};bindDataFields(w);if(isSeries(w)){renderEpisode(w,0);document.querySelectorAll('[data-eptab]').forEach(b=>b.onclick=()=>selectEpisode(w,+b.dataset.eptab));document.querySelectorAll('[data-ep]').forEach(x=>x.oninput=()=>{w.episodes[+x.dataset.ep][x.dataset.epkey]=x.value;save(w)})}$('#backBtn').onclick=()=>{editing=null;render()};$('#deleteBtn').onclick=async()=>{if(confirm('이 작품을 삭제할까요?')){await delDB(w.id);works=works.filter(x=>x.id!==w.id);editing=null;render()}}}

function renderCollectResults(){let ct=$('#collectType').value,form=$('#collectForm').value,genre=$('#collectGenre').value,tags=$('#collectTags').value.split(',').map(x=>x.trim()).filter(Boolean),rows=[];works.filter(w=>(form==='전체'||w.type===form)&&(genre==='전체'||w.genre===genre)&&tags.every(t=>w.tags.includes(t))).forEach(w=>{let add=(label,text)=>{if(String(text||'').trim())rows.push({w,label,text})};if(ct==='tags')add('',w.tags.join(' · '));else if(ct==='hook')add('',w.hook);else if(ct==='logline')add('',w.logline);else if(ct==='characters')add('',w.characters);else if(ct==='qa'){add('Q&A',w.qaText);w.episodes.forEach(e=>add(`${e.number}화 Q&A`,e.qaText))}else if(ct==='story'){let fmt=a=>['gi','seung','jeon','gyeol'].map((k,i)=>a?.[k]?`${['기','승','전','결'][i]}
${a[k]}`:'').filter(Boolean).join('\n\n');add('기승전결',fmt(w.acts));w.episodes.forEach(e=>add(`${e.number}화 기승전결`,fmt(e.acts)))}else if(ct==='check'){add('CHECK',w.check);w.episodes.forEach(e=>add(`${e.number}화 CHECK`,e.check))}else if(ct.startsWith('point:')){let k=ct.split(':')[1],n=POINTS.find(x=>x[0]===k)[1];add(n,w.points[k]);w.episodes.forEach(e=>add(`${e.number}화 ${n}`,e.points[k]))}});$('#collectResults').innerHTML=rows.length?rows.map(r=>`<div class="card" style="margin-bottom:10px"><b>${esc(r.w.title)}</b>${r.label?` <span class="meta">${esc(r.label)}</span>`:''}<div style="white-space:pre-wrap;margin-top:7px">${esc(r.text)}</div></div>`).join(''):'<div class="empty">기록된 내용이 없습니다.</div>'}
function renderSettings(){let last=localStorage.getItem('storydb_lastbackup');$('#main').innerHTML=`<div class="settings-grid"><div class="panel"><div class="section-title">데이터</div><p class="notice">${last?'마지막 전체 백업: '+new Date(last).toLocaleString():'아직 전체 백업 기록이 없습니다.'}</p><div class="filters"><button class="btn" id="exportAll">전체 JSON 백업</button><button class="btn" id="importAll">JSON 불러오기</button><button class="btn" id="exportCSV">CSV 내보내기</button><button class="btn" id="exportMDZip">전체 MD ZIP</button></div><input type="file" id="fileInput" accept=".json" class="hidden"><div class="sep"></div><button class="btn" id="clearFavs">즐겨찾기 전체 해제</button> <button class="btn danger" id="resetAll">전체 초기화</button></div><div class="panel"><div class="section-title">장르 관리</div><div id="genreList">${genres.map((g,i)=>`<div class="listedit"><input value="${esc(g)}" data-genre="${i}"><button class="mini" data-delgenre="${i}">×</button></div>`).join('')}</div><button class="mini" id="addGenre">＋ 장르</button></div></div><div class="panel"><div class="section-title">작품별 JSON</div><select id="workPick" style="width:100%;padding:9px;border:1px solid var(--line);border-radius:9px"><option value="">${works.some(w=>w.favorite)?'즐겨찾기 작품 선택':'즐겨찾기한 작품이 없습니다'}</option>${works.filter(w=>w.favorite).map(w=>`<option value="${w.id}">${esc(w.title||'제목 없음')}</option>`).join('')}</select><div class="filters" style="margin-top:9px"><button class="btn" id="exportOne">선택 작품 내보내기</button><button class="btn" id="importOne">작품 JSON 불러오기</button></div></div>`;
$('#exportAll').onclick=()=>{downloadJSON({app:'story-db',dataVersion:DATA_VERSION,exportedAt:new Date().toISOString(),works,genres},'story-db-backup.json');localStorage.setItem('storydb_lastbackup',new Date().toISOString());renderSettings()};$('#importAll').onclick=()=>{$('#fileInput').dataset.mode='all';$('#fileInput').click()};$('#importOne').onclick=()=>{$('#fileInput').dataset.mode='one';$('#fileInput').click()};$('#fileInput').onchange=importJSON;$('#exportOne').onclick=()=>{let w=works.find(x=>x.id===$('#workPick').value);if(w)downloadJSON({app:'story-db-work',dataVersion:DATA_VERSION,work:w},safeName(w.title)+'.json')};$('#exportCSV').onclick=exportCSV;$('#exportMDZip').onclick=exportMDZip;$('#clearFavs').onclick=async()=>{if(confirm('모든 작품의 즐겨찾기를 해제할까요?')){for(let w of works){if(w.favorite){w.favorite=false;w.updatedAt=new Date().toISOString();await putDB(w)}}renderSettings()}};$('#resetAll').onclick=async()=>{if(confirm('모든 작품을 삭제합니다. JSON 백업을 확인했나요?')&&confirm('정말 전체 초기화할까요?')){let tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).clear();tx.oncomplete=()=>{works=[];renderSettings()}}};document.querySelectorAll('[data-genre]').forEach(x=>x.onchange=()=>{genres[+x.dataset.genre]=x.value.trim()||'기타';saveGenres();renderSettings()});document.querySelectorAll('[data-delgenre]').forEach(b=>b.onclick=()=>{if(genres.length>1){genres.splice(+b.dataset.delgenre,1);saveGenres();renderSettings()}});$('#addGenre').onclick=()=>{genres.push('새 장르');saveGenres();renderSettings()}}

function downloadJSON(obj,name){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
function safeName(s){return (s||'work').replace(/[\\/:*?"<>|]/g,'_')}
async function importJSON(e){let f=e.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text());let mode=e.target.dataset.mode;if(mode==='all'){let incoming=Array.isArray(data)?data:(data.works||[]);if(!incoming.length)throw Error('작품 데이터 없음');if(confirm(`${incoming.length}개 작품을 불러옵니다. 같은 ID는 덮어씁니다.`)){for(let w of incoming){migrate(w);await putDB(w)}if(data.genres){genres=data.genres;saveGenres()}works=await allDB();renderSettings()}}else{let w=data.work||data;migrate(w);let old=works.find(x=>x.id===w.id);if(old&&!confirm('같은 작품 ID가 있습니다. 덮어쓸까요?\n취소를 누르면 복사본으로 추가합니다.'))w.id=uid();await putDB(w);works=await allDB();renderSettings()}}catch(err){alert('JSON을 읽지 못했습니다: '+err.message)}e.target.value=''}
function migrate(w){w.id=w.id||uid();w.tags=w.tags||[];w.watchedDate=w.watchedDate||'';let oldVersion=Number(w.dataVersion||1);if(!w.castText){w.castText=Array.isArray(w.cast)?w.cast.map(x=>[x.name,x.actor].filter(Boolean).join(' / ')).filter(Boolean).join(', '):(w.cast||'')}if(!w.qaText){w.qaText=Array.isArray(w.qa)?w.qa.map(x=>[x.q,x.a?`(${x.a})`:''].filter(Boolean).join(' ')).filter(Boolean).join('\n'):String(w.qa||'')}w.acts=w.acts||{gi:'',seung:'',jeon:'',gyeol:''};w.points=w.points||Object.fromEntries(POINTS.map(([k])=>[k,'']));for(let [k] of POINTS)if(w.points[k]==null)w.points[k]='';w.characters=w.characters||'';w.check=w.check||'';w.episodes=w.episodes||[];if(w.watchedEpisodes==null){let last=0;w.episodes.forEach((e,i)=>{let vals=[e.summary,e.qaText,e.check,e.story,...Object.values(e.acts||{}),...Object.values(e.points||{})];if(vals.some(v=>String(v||'').trim()))last=i+1});w.watchedEpisodes=String(last)}w.episodes.forEach((e,i)=>{e.number=e.number||i+1;e.summary=e.summary||'';if(!e.qaText)e.qaText=Array.isArray(e.qa)?e.qa.map(x=>[x.q,x.a?`(${x.a})`:''].filter(Boolean).join(' ')).filter(Boolean).join('\n'):String(e.qa||'');if(!e.acts)e.acts={gi:e.story||'',seung:'',jeon:'',gyeol:''};for(let k of ['gi','seung','jeon','gyeol'])if(e.acts[k]==null)e.acts[k]='';e.points=e.points||Object.fromEntries(POINTS.map(([k])=>[k,'']));for(let [k] of POINTS)if(e.points[k]==null)e.points[k]='';e.check=e.check||''});w.createdAt=w.createdAt||new Date().toISOString();w.updatedAt=w.updatedAt||w.createdAt;w.favorite=!!w.favorite;w.dataVersion=DATA_VERSION;return w}

function markdownForWork(w){
  const lines=[], add=(heading,value,level=2)=>{
    value=String(value??'').trim();
    if(!value)return;
    lines.push(`${'#'.repeat(level)} ${heading}`,'',value,'');
  };
  lines.push(`# ${w.title||'제목 없음'}`,'');
  const meta=[];
  if(w.watchedDate)meta.push(`- 감상일: ${w.watchedDate}`);
  if(w.type)meta.push(`- 형식: ${w.type}`);
  if(w.genre)meta.push(`- 장르: ${w.genre}`);
  if(w.length)meta.push(`- ${isSeries(w)?'총 회차':'러닝타임'}: ${w.length}${isSeries(w)?'부작':'분'}`);if(isSeries(w))meta.push(`- 본 회차: ${w.watchedEpisodes||0}화`);
  if(w.tags?.length)meta.push(`- 태그: ${w.tags.join(', ')}`);
  if(meta.length)lines.push(...meta,'');
  add('등장인물',w.castText);
  add('로그라인',w.logline);
  add('후킹',w.hook);
  add('CHARACTER',w.characters);

  const addActs=(acts,level=2)=>{
    const names=[['gi','기'],['seung','승'],['jeon','전'],['gyeol','결']];
    for(const [k,n] of names)add(n,acts?.[k],level);
  };
  const addPoints=(points,level=2)=>{
    for(const [k,n] of POINTS)add(n,points?.[k],level);
  };

  if(isSeries(w)){
    if(w.episodes?.some(e=>String(e.summary||'').trim())){
      lines.push('## EPISODE MAP','');
      for(const e of w.episodes){
        if(String(e.summary||'').trim())lines.push(`- ${e.number}화: ${e.summary}`);
      }
      lines.push('');
    }
    for(const e of (w.episodes||[])){
      const hasData=[e.qaText,e.check,...Object.values(e.acts||{}),...Object.values(e.points||{})].some(v=>String(v||'').trim());
      if(!hasData)continue;
      lines.push(`## ${e.number}화`,'');
      add('Q&A',e.qaText,3);
      addActs(e.acts,3);
      addPoints(e.points,3);
      add('CHECK',e.check,3);
    }
  }else{
    add('Q&A',w.qaText);
    addActs(w.acts);
    addPoints(w.points);
    add('CHECK',w.check);
  }
  return lines.join('\n').replace(/\n{4,}/g,'\n\n\n').trim()+'\n';
}
function crc32(bytes){
  let c=0xffffffff;
  for(const b of bytes){
    c^=b;
    for(let k=0;k<8;k++)c=(c>>>1)^((c&1)?0xedb88320:0);
  }
  return (c^0xffffffff)>>>0;
}
function u16(n){return new Uint8Array([n&255,(n>>>8)&255])}
function u32(n){return new Uint8Array([n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255])}
function concatBytes(parts){
  let len=parts.reduce((n,p)=>n+p.length,0), out=new Uint8Array(len), off=0;
  for(const p of parts){out.set(p,off);off+=p.length}
  return out;
}
function makeStoredZip(files){
  const enc=new TextEncoder(), locals=[], centrals=[];
  let offset=0;
  const now=new Date(), dosTime=((now.getHours()<<11)|(now.getMinutes()<<5)|(now.getSeconds()>>1))&0xffff;
  const dosDate=((((now.getFullYear()-1980)&127)<<9)|((now.getMonth()+1)<<5)|now.getDate())&0xffff;
  for(const f of files){
    const name=enc.encode(f.name), data=enc.encode(f.text), crc=crc32(data);
    const local=concatBytes([
      u32(0x04034b50),u16(20),u16(0x0800),u16(0),u16(dosTime),u16(dosDate),
      u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),name,data
    ]);
    locals.push(local);
    const central=concatBytes([
      u32(0x02014b50),u16(20),u16(20),u16(0x0800),u16(0),u16(dosTime),u16(dosDate),
      u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),u16(0),u16(0),
      u16(0),u32(0),u32(offset),name
    ]);
    centrals.push(central);
    offset+=local.length;
  }
  const centralBytes=concatBytes(centrals);
  const end=concatBytes([
    u32(0x06054b50),u16(0),u16(0),u16(files.length),u16(files.length),
    u32(centralBytes.length),u32(offset),u16(0)
  ]);
  return concatBytes([...locals,centralBytes,end]);
}
function exportMDZip(){
  if(!works.length){alert('내보낼 작품이 없습니다.');return}
  const used=new Map(), files=works.map((w,i)=>{
    let base=safeName(w.title||`작품-${i+1}`)||`작품-${i+1}`;
    let count=(used.get(base)||0)+1;used.set(base,count);
    let name=count===1?`${base}.md`:`${base} (${count}).md`;
    return {name,text:markdownForWork(w)};
  });
  const zip=makeStoredZip(files), a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([zip],{type:'application/zip'}));
  a.download=`story-db-md-${new Date().toISOString().slice(0,10)}.zip`;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

function exportCSV(){let head=['제목','감상일','형식','장르','러닝타임/총회차','본 회차','태그','로그라인','후킹','CHARACTER','등장인물','회차','에피소드맵','Q&A','기','승','전','결','오프닝','발단','주요 장애물','PUSH','중간점','절정','엔드','CHECK'];let rows=[];works.forEach(w=>{let base=[w.title,w.watchedDate,w.type,w.genre,w.length,isSeries(w)?(w.watchedEpisodes||0):'',w.tags.join('|'),w.logline,w.hook,w.characters,w.castText];if(isSeries(w)&&w.episodes.length){w.episodes.forEach(e=>rows.push([...base,e.number,e.summary,e.qaText,e.acts.gi,e.acts.seung,e.acts.jeon,e.acts.gyeol,e.points.opening,e.points.inciting,e.points.obstacle,e.points.push,e.points.midpoint,e.points.climax,e.points.end,e.check]))}else rows.push([...base,'','',w.qaText,w.acts.gi,w.acts.seung,w.acts.jeon,w.acts.gyeol,w.points.opening,w.points.inciting,w.points.obstacle,w.points.push,w.points.midpoint,w.points.climax,w.points.end,w.check])});let csv='\uFEFF'+[head,...rows].map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='story-db.csv';a.click();URL.revokeObjectURL(a.href)}
